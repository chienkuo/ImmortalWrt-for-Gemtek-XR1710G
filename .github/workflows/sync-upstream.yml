name: Sync Upstream ImmortalWrt

on:
  schedule:
    - cron: '0 19 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Check for updates
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/master)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "No updates available (local: ${LOCAL:0:7}, remote: ${REMOTE:0:7})"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates available: ${LOCAL:0:7} -> ${REMOTE:0:7}"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Merge upstream (strategy: theirs)"
        id: merge_theirs
        if: steps.check.outputs.has_updates == 'true'
        run: |
          echo "Attempting merge with -X theirs strategy..."
          if git merge --no-edit upstream/master -X theirs; then
            echo "Merge succeeded with -X theirs"
            echo "merge_success=true" >> "$GITHUB_OUTPUT"
          else
            echo "Merge with -X theirs failed, aborting..."
            git merge --abort 2>/dev/null || true
            echo "merge_success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Merge upstream (fallback: recursive)"
        id: merge_fallback
        if: steps.check.outputs.has_updates == 'true' && steps.merge_theirs.outputs.merge_success != 'true'
        run: |
          echo "Attempting merge with recursive strategy..."
          if git merge --no-edit upstream/master -X recursive -X patience; then
            echo "Merge succeeded with recursive strategy"
            echo "merge_success=true" >> "$GITHUB_OUTPUT"
          else
            echo "Merge with recursive also failed, aborting..."
            git merge --abort 2>/dev/null || true
            echo "::error::All merge strategies failed."
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U 2>/dev/null || echo "No conflict files found"
            echo "merge_success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check merge result
        id: merge_check
        if: steps.check.outputs.has_updates == 'true'
        run: |
          MERGE_SUCCESS="${{ steps.merge_theirs.outputs.merge_success }}"
          if [ "$MERGE_SUCCESS" != "true" ]; then
            MERGE_SUCCESS="${{ steps.merge_fallback.outputs.merge_success }}"
          fi
          if [ "$MERGE_SUCCESS" != "true" ]; then
            echo "::error::Merge failed with all strategies."
            echo "Attempting to rebase onto upstream instead..."
            git rebase upstream/master || {
              echo "::error::Rebase also failed."
              git rebase --abort 2>/dev/null || true
              exit 1
            }
            echo "Rebase succeeded!"
          fi

      - name: Restore local customizations
        if: steps.check.outputs.has_updates == 'true'
        run: |
          # Restore Airoha-specific kernel configs that may be lost during merge
          CONFIG_FILE="target/linux/airoha/an7583/config-6.18"
          if [ -f "$CONFIG_FILE" ]; then
            # Add back critical Airoha configs if missing
            if ! grep -q "CONFIG_AIROHA_CPU_PM_DOMAIN" "$CONFIG_FILE"; then
              sed -i '1a CONFIG_AIROHA_CPU_PM_DOMAIN=y\n# CONFIG_MTK_SCPSYS is not set\n# CONFIG_MTK_SCPSYS_PM_DOMAINS is not set\nCONFIG_AIROHA_SCU_SSR=y' "$CONFIG_FILE"
              echo "Restored Airoha CPU PM Domain config"
            fi
          fi

      - name: Push to origin
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git add -A
          git commit -m "Sync upstream ImmortalWrt" || echo "No changes to commit"
          echo "Attempting to push..."
          if git push origin master; then
            echo "Push succeeded!"
          else
            echo "::error::Push failed. Attempting force push..."
            git push origin master --force || {
              echo "::error::Force push also failed. May be branch protected or permission issue."
              echo "Please check branch protection rules or manually resolve conflicts."
              exit 1
            }
          fi

      - name: Show result
        if: always()
        run: |
          echo "=== Sync Result ==="
          git log --oneline -5 || true
          echo "=== Remote Status ==="
          git remote -v || true
